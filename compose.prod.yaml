# Production overrides. The server keeps its secret configuration outside the release tree.
# Resource limits, log rotation and PostgreSQL tuning come from compose.yaml.
services:
  web:
    # За внешним reverse proxy (порты 80/443 заняты) опубликуйте на loopback, например
    # WEB_HTTP_PUBLISH=127.0.0.1:18100 и WEB_HTTPS_PUBLISH=127.0.0.1:18143.
    ports:
      - "${WEB_HTTP_PUBLISH:-80}:80"
      - "${WEB_HTTPS_PUBLISH:-443}:443"
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в production .env}
  backend:
    environment:
      APP_ENV: production
      # Секрет подписи MCP-оценок: пусто — эфемерный на процесс (оценки живут 15 минут).
      MCP_ESTIMATE_SECRET: ${MCP_ESTIMATE_SECRET:-}
      # Демо-проекты в production по умолчанию не засеваются; включить можно явно.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arkhitektor}:${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в production .env}@db:5432/${POSTGRES_DB:-arkhitektor}
