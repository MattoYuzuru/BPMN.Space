# Локальный стек: `make up` → http://localhost:8080
# Сейчас backend — mock на фикстурах (задача #2). Postgres и bpmn-tools добавляются в задаче #6.
name: arkhitektor

services:
  backend:
    build: ./backend
    environment:
      APP_ENV: docker
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
