# Локальный стек: `make up` → http://localhost:8080
# PostgreSQL хранит проекты и состояние прогона; загруженные файлы живут в volume.
name: arkhitektor

# Ротация логов контейнеров и лимиты ресурсов (под VPS на 4 ГБ) общие для локального стека
# и production: compose.prod.yaml накладывается поверх этого файла.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-5}"

services:
  db:
    image: postgres:16-alpine
    # Параметры для 4 ГБ RAM: backend держит до 20 соединений пула, остальное — запас.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}
    logging: *logging
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arkhitektor}
      POSTGRES_USER: ${POSTGRES_USER:-arkhitektor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bpmn-tools:
    build: ./infra/bpmn-tools
    mem_limit: ${BPMN_TOOLS_MEM_LIMIT:-768m}
    cpus: ${BPMN_TOOLS_CPUS:-1.0}
    logging: *logging
    environment:
      BPMN_TOOLS_TIMEOUT_SEC: ${BPMN_TOOLS_TIMEOUT_SEC:-20}
      BPMN_TOOLS_POOL_SIZE: ${BPMN_TOOLS_POOL_SIZE:-2}
      BPMN_TOOLS_QUEUE_LIMIT: ${BPMN_TOOLS_QUEUE_LIMIT:-32}
      BPMN_TOOLS_WORKER_MAX_JOBS: ${BPMN_TOOLS_WORKER_MAX_JOBS:-200}
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    build: ./backend
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    cpus: ${BACKEND_CPUS:-1.5}
    logging: *logging
    environment:
      APP_ENV: docker
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ONBOARDING_ENABLED: ${ONBOARDING_ENABLED:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_API_PER_MIN: ${RATE_LIMIT_API_PER_MIN:-600}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-20}
      RATE_LIMIT_EXPENSIVE_PER_MIN: ${RATE_LIMIT_EXPENSIVE_PER_MIN:-60}
      RATE_LIMIT_EXPENSIVE_IP_PER_MIN: ${RATE_LIMIT_EXPENSIVE_IP_PER_MIN:-120}
      MCP_ESTIMATE_SECRET: ${MCP_ESTIMATE_SECRET:-}
      MCP_ESTIMATE_TTL_SEC: ${MCP_ESTIMATE_TTL_SEC:-900}
      MCP_EXPENSIVE_PER_MIN: ${MCP_EXPENSIVE_PER_MIN:-30}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SEC: ${DATABASE_POOL_TIMEOUT_SEC:-5}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arkhitektor}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-arkhitektor}
      UPLOAD_DIR: /data/uploads
      BPMN_TOOLS_URL: http://bpmn-tools:3000
      # Исходящий прокси к провайдерам моделей и инструментов (Anthropic, OpenAI, Exa…), если из
      # сети сервера они недоступны: см. «Выход через SSH-мост» в docs/deployment.md. Адреса
      # пользователей (совместимые провайдеры) прокси не используют — их закрепляет SSRF-guard.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-db,bpmn-tools,backend,localhost,127.0.0.1}
      # uvicorn доверяет X-Forwarded-Proto от Caddy: адрес MCP в выдаче токена — https.
      # Backend не публикует порт наружу, поэтому доверять сети Compose безопасно.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      BPMN_TOOLS_TIMEOUT_SEC: ${BPMN_TOOLS_TIMEOUT_SEC:-20}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-120}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      LLM_SEMANTIC_REVIEW: ${LLM_SEMANTIC_REVIEW:-true}
      LLM_JSON_MAX_TOKENS: ${LLM_JSON_MAX_TOKENS:-}
      LLM_CHUNK_MAX_TOKENS: ${LLM_CHUNK_MAX_TOKENS:-16384}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BASE_SEC: ${LLM_RETRY_BASE_SEC:-1}
      LLM_RETRY_MAX_SEC: ${LLM_RETRY_MAX_SEC:-30}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT_SEC: ${DEEPSEEK_TIMEOUT_SEC:-120}
      DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
      LLM_JSON_TEMPERATURE: ${LLM_JSON_TEMPERATURE:-0}
      LLM_ANTHROPIC_EFFORT: ${LLM_ANTHROPIC_EFFORT:-}
      LLM_SERVER_MAX_EFFORT: ${LLM_SERVER_MAX_EFFORT:-}
      LLM_ALLOWED_PRIVATE_HOSTS: ${LLM_ALLOWED_PRIVATE_HOSTS:-}
      LLM_AGENT_MODE: ${LLM_AGENT_MODE:-false}
      LLM_AGENT_MAX_STEPS: ${LLM_AGENT_MAX_STEPS:-24}
      LLM_AGENT_READ_MAX_CHARS: ${LLM_AGENT_READ_MAX_CHARS:-12000}
      LLM_AGENT_SEARCH_LIMIT: ${LLM_AGENT_SEARCH_LIMIT:-5}
      LLM_AGENT_SEARCH_SNIPPET_CHARS: ${LLM_AGENT_SEARCH_SNIPPET_CHARS:-400}
      LLM_MAX_RESPONSE_BYTES: ${LLM_MAX_RESPONSE_BYTES:-8388608}
      LLM_MODELS_CACHE_SEC: ${LLM_MODELS_CACHE_SEC:-300}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      RUN_DEADLINE_SEC: ${RUN_DEADLINE_SEC:-600}
      RUN_DEADLINE_PER_1K_CHARS_SEC: ${RUN_DEADLINE_PER_1K_CHARS_SEC:-4}
      RUN_DEADLINE_MAX_SEC: ${RUN_DEADLINE_MAX_SEC:-7200}
      LLM_CONTEXT_BUDGET_CHARS: ${LLM_CONTEXT_BUDGET_CHARS:-120000}
      LLM_CONTEXT_BUDGET_MAX_CHARS: ${LLM_CONTEXT_BUDGET_MAX_CHARS:-0}
      LLM_CHUNK_CHARS: ${LLM_CHUNK_CHARS:-24000}
      LLM_PARALLEL_REQUESTS: ${LLM_PARALLEL_REQUESTS:-4}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-3}
      DEEPSEEK_RETRY_BASE_SEC: ${DEEPSEEK_RETRY_BASE_SEC:-1}
      DEEPSEEK_RETRY_MAX_SEC: ${DEEPSEEK_RETRY_MAX_SEC:-30}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-62914560}
      MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-524288000}
      MAX_DIAGRAM_BYTES: ${MAX_DIAGRAM_BYTES:-5242880}
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-1500000}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-1000}
      MAX_SHEET_ROWS: ${MAX_SHEET_ROWS:-20000}
      PARSE_TIMEOUT_SEC: ${PARSE_TIMEOUT_SEC:-180}
      MEDIA_SEGMENT_SEC: ${MEDIA_SEGMENT_SEC:-600}
      STT_PARALLEL_SEGMENTS: ${STT_PARALLEL_SEGMENTS:-3}
      MEDIA_FRAME_WIDTH: ${MEDIA_FRAME_WIDTH:-768}
      MEDIA_FRAME_DEDUP_BITS: ${MEDIA_FRAME_DEDUP_BITS:-8}
      MEDIA_FRAME_MAX_FRAMES: ${MEDIA_FRAME_MAX_FRAMES:-600}
      MEDIA_FRAME_FFMPEG_TIMEOUT_SEC: ${MEDIA_FRAME_FFMPEG_TIMEOUT_SEC:-900}
      MEDIA_FRAME_MAX_CONCURRENT: ${MEDIA_FRAME_MAX_CONCURRENT:-1}
      MEDIA_VISION_BATCH_SIZE: ${MEDIA_VISION_BATCH_SIZE:-4}
      MEDIA_VISION_MAX_TOKENS: ${MEDIA_VISION_MAX_TOKENS:-2048}
      MEDIA_SUMMARY_MAX_TOKENS: ${MEDIA_SUMMARY_MAX_TOKENS:-800}
      OCR_PAGES_PER_REQUEST: ${OCR_PAGES_PER_REQUEST:-10}
      OCR_MAX_TOKENS: ${OCR_MAX_TOKENS:-16384}
      OCR_TOKENS_PER_PAGE: ${OCR_TOKENS_PER_PAGE:-1200}
      VERSION_SESSION_IDLE_SEC: ${VERSION_SESSION_IDLE_SEC:-600}
      VERSION_SESSION_MAX_SEC: ${VERSION_SESSION_MAX_SEC:-3600}
      MOCK_DELAY_SCALE: ${MOCK_DELAY_SCALE:-1.0}
      MOCK_TRANSCRIPTION_DELAY_SEC: ${MOCK_TRANSCRIPTION_DELAY_SEC:-1.0}
      MOCK_PARSE_DELAY_SEC: ${MOCK_PARSE_DELAY_SEC:-1.5}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      bpmn-tools:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: ${WEB_CPUS:-0.5}
    logging: *logging
    environment:
      # Адрес сайта с HTTPS (Let's Encrypt). За внешним reverse proxy с TLS задайте
      # http://<домен>, чтобы этот Caddy не выпускал сертификат сам.
      SITE_ADDRESS: ${SITE_ADDRESS:-bpmn.space, www.bpmn.space}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # SSH-мост к HTTP-прокси на другом сервере: включается профилем `egress`
  # (COMPOSE_PROFILES=egress) и `HTTPS_PROXY=http://<логин>:<пароль>@egress:3128`.
  egress:
    profiles: [egress]
    build: ./infra/egress-relay
    mem_limit: 64m
    cpus: 0.25
    logging: *logging
    environment:
      EGRESS_TARGET: ${EGRESS_TARGET:-}
      EGRESS_PROXY: ${EGRESS_PROXY:-127.0.0.1:3128}
    volumes:
      - ${EGRESS_SSH_DIR:-./infra/egress-relay/ssh}:/run/egress:ro
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
